; llama.cpp router presets -- every model the atlas can ask for (adapted from healthathon).
;
; scripts/serve_llm.sh starts ONE llama-server in router mode with --models-max 1. Each
; section is a model name a request can ask for; the router loads it on demand and unloads
; whatever was resident before. Section names must match `llm.model` in config/atlas.yaml
; (or LLM_MODEL). Relative paths resolve from the repo root (serve_llm.sh cds there);
; models/ is a symlink to the healthathon models directory.
;
; Measured in healthathon on this CPU: the 3B is resident at ~3.4 GB (model + 8k KV cache),
; ~10 tok/s generation. The 1.5B is ~2x faster but tends to transcribe its sources.

[*]
; 6 physical cores: generation is memory-bandwidth bound and gets slower with SMT siblings;
; prompt prefill is compute bound and benefits from them.
threads = 6
threads-batch = 12
parallel = 1
no-webui = true

; --- Literature Q&A (default) ---------------------------------------------------------
[qwen2.5-3b]
model = models/gguf/Qwen2.5-3B-Instruct-Q4_K_M.gguf
ctx-size = 6144
; the system prompt is constant, so reuse its KV prefix across questions
cache-reuse = 256

; Faster, weaker option: ./start --model 1.5b
[qwen2.5-1.5b]
model = models/gguf/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
ctx-size = 6144
cache-reuse = 256

; Larger option if RAM allows (~4.4 GB resident at 6k context): ./start --model 4b
[qwen3-4b]
model = models/gguf/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
ctx-size = 6144
cache-reuse = 256
