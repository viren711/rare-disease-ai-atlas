# Labelled questions for the literature RAG (scripts/eval_ask.py).
# kind: answerable   -> must be answered; expected_pmids = every corpus paper whose TITLE matches all of
#                       relevance_title_regex (case-insensitive), resolved against data/raw/pubmed/*/abstracts.jsonl.
#                       Retrieval hit = any expected PMID in the top 5.
#                       broad: true marks lay-phrased questions (lower rerank scores; used for calibration).
#       unanswerable -> in-domain, but abstracts cannot answer (prices, phone numbers, appointments, future events):
#                       must be refused (grounding gate or citation check / sentinel).
#       off_topic    -> must be refused, ideally at the topic gate before retrieval.
